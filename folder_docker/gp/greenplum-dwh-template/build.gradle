import groovy.sql.Sql

import java.nio.file.Files
import java.nio.file.Paths
import java.sql.SQLException

buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath 'org.postgresql:postgresql:42.2.6'
        classpath 'org.liquibase.gradle:org.liquibase.gradle.gradle.plugin:2.0.4'
    }
}

plugins {
    id 'groovy'
    id 'base'
    id 'idea'
    id 'org.liquibase.gradle' version '2.0.4'
}

dependencies {
    liquibaseRuntime 'org.liquibase:liquibase-core:4.2.2'
    liquibaseRuntime 'org.postgresql:postgresql:42.2.6'
    testCompile 'org.spockframework:spock-core:1.3-groovy-2.5'
    testCompile 'org.hamcrest:hamcrest-all:1.3'
    testCompile 'org.postgresql:postgresql:42.2.6'
    testCompile 'org.slf4j:slf4j-api:1.7.27'
    testCompile 'org.slf4j:jul-to-slf4j:1.7.27'
}

apply plugin: "org.liquibase.gradle"

allprojects {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

sourceSets {
    main {
        resources {
            srcDir 'src/main/db'
        }
    }
}

ext {
    dbHost = System.getenv("DB_HOST") ?: "localhost"
    dbPort = System.getenv("DB_PORT") ?: "5432"
    dbName = System.getenv("DB_NAME") ?: "adb"
    dbUser = System.getenv("DB_USER") ?: System.getenv("USERNAME")
    dbPassword = System.getenv("DB_PASSWORD") ?: "gpadmin"
    dbUrl = "jdbc:postgresql://$dbHost:$dbPort/$dbName" as String
    isIncremental = System.getenv("INCREMENTAL") ?: "false"
}

task waitForDb() {
    doLast {
        def sqlClassLoader = Sql.classLoader
        project.buildscript.configurations.classpath.each { sqlClassLoader.addURL it.toURI().toURL() }
        def driverClassName = "org.postgresql.Driver" as String
        def props = [user: project.dbUser] as Properties
        if (project.dbPassword) {
            props.put("password", dbPassword)
        }
        def waitingThreshold = 120000
        def waited = 0
        while (waited < waitingThreshold) {
            try {
                def sql = Sql.newInstance(project.dbUrl, props, driverClassName)
                sql.execute("select 1")
                sql.close()
                println "Connected to ${project.dbUrl}"
                break
            } catch (SQLException ex) {
                println "Could not connect to db due to ${ex.toString()}"
                sleep(1000)
                waited += 1000
            }
        }
        if (waited == waitingThreshold) {
            throw new Exception("Waiting threshold is reached")
        }

    }
}

task preSql() {
    doLast {
        def sqlClassLoader = Sql.classLoader
        project.buildscript.configurations.classpath.each { sqlClassLoader.addURL it.toURI().toURL() }
        def driverClassName = "org.postgresql.Driver" as String
        def props = [user: project.dbUser] as Properties
        if (project.dbPassword) {
            props.put("password", dbPassword)
        }

        try {
            def sql = Sql.newInstance(project.dbUrl, props, driverClassName)
            sql.execute("SELECT public.fn_presql();")
            sql.close()
            println "PreSQL scripts are executed"
        } catch (SQLException ex) {
            println "Could not connect to db due to ${ex.toString()}"
        }
}

preSql.dependsOn(":update")

task postSql() {
    doLast {
        def sqlClassLoader = Sql.classLoader
        project.buildscript.configurations.classpath.each { sqlClassLoader.addURL it.toURI().toURL() }
        def driverClassName = "org.postgresql.Driver" as String
        def props = [user: project.dbUser] as Properties
        if (project.dbPassword) {
            props.put("password", dbPassword)
        }

        try {
            def sql = Sql.newInstance(project.dbUrl, props, driverClassName)
            sql.execute("SELECT public.fn_postsql();")
            sql.close()
            println "PostSQL scripts are executed"
        } catch (SQLException ex) {
            println "Could not connect to db due to ${ex.toString()}"
        }
        }
    }
}

tasks.getByPath(":test").dependsOn(":postSql")

liquibase {
    activities {
        main {
            changeLogFile 'src/main/db/changelog.xml'
            url project.ext.dbUrl
            username project.ext.dbUser
            password project.ext.dbPassword
            logLevel 'SEVERE'
        }
    }
}
